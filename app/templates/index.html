<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client Churn Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(135deg, #eef2ff, #f8fafc);

            min-height: 100vh;

            padding: 40px 20px;

            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .header p {
            color: #64748b;
            font-size: 16px;
        }

        .card {
            background-color: white;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 20px;
            color: #1e3a8a;

            margin-bottom: 25px;

            padding-bottom: 12px;

            border-bottom: 1px solid #e2e8f0;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;

            font-weight: bold;

            margin-bottom: 8px;

            color: #334155;
        }

        input,
        select {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            background-color: #f8fafc;

            transition: 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;

            border-color: #2563eb;

            background-color: white;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input:hover,
        select:hover {
            border-color: #94a3b8;
        }

        .button-container {
            margin-top: 30px;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            display: none;

            margin-top: 25px;

            padding: 18px;

            border-radius: 10px;

            text-align: center;

            font-size: 18px;

            background-color: #eff6ff;

            color: #1e40af;

            border: 1px solid #bfdbfe;
        }

        #result.error {
            background-color: #fef2f2;
            color: #b91c1c;
            border-color: #fecaca;
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 13px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>

</head>


<body>

<div class="container">

    <div class="header">
        <h1>Client Churn Prediction</h1>

        <p>
            Enter the customer's information to predict
            whether the customer is likely to churn.
        </p>
    </div>


    <div class="card">

        <h2 class="section-title">
            Customer Information
        </h2>


        <form id="predictionForm">

            <div class="form-grid">


                <!-- Gender -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender">

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>

                </div>


                <!-- Senior Citizen -->

                <div class="form-group">

                    <label for="SeniorCitizen">
                        Senior Citizen
                    </label>

                    <select id="SeniorCitizen">

                        <option value="No">
                            No
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                    </select>

                </div>


                <!-- Partner -->

                <div class="form-group">

                    <label for="Partner">
                        Partner
                    </label>

                    <select id="Partner">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- Dependents -->

                <div class="form-group">

                    <label for="Dependents">
                        Dependents
                    </label>

                    <select id="Dependents">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- Tenure -->

                <div class="form-group">

                    <label for="tenure">
                        Tenure (Months)
                    </label>

                    <input
                        type="number"
                        id="tenure"
                        min="0"
                        placeholder="Example: 24"
                        required
                    >

                </div>


                <!-- Phone Service -->

                <div class="form-group">

                    <label for="PhoneService">
                        Phone Service
                    </label>

                    <select id="PhoneService">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- Multiple Lines -->

                <div class="form-group">

                    <label for="MultipleLines">
                        Multiple Lines
                    </label>

                    <select id="MultipleLines">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                        <option value="No phone service">
                            No Phone Service
                        </option>

                    </select>

                </div>


                <!-- Internet Service -->

                <div class="form-group">

                    <label for="InternetService">
                        Internet Service
                    </label>

                    <select id="InternetService">

                        <option value="DSL">
                            DSL
                        </option>

                        <option value="Fiber optic">
                            Fiber Optic
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- Online Security -->

                <div class="form-group">

                    <label for="OnlineSecurity">
                        Online Security
                    </label>

                    <select id="OnlineSecurity">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                        <option value="No internet service">
                            No Internet Service
                        </option>

                    </select>

                </div>


                <!-- Online Backup -->

                <div class="form-group">

                    <label for="OnlineBackup">
                        Online Backup
                    </label>

                    <select id="OnlineBackup">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                        <option value="No internet service">
                            No Internet Service
                        </option>

                    </select>

                </div>


                <!-- Device Protection -->

                <div class="form-group">

                    <label for="DeviceProtection">
                        Device Protection
                    </label>

                    <select id="DeviceProtection">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                        <option value="No internet service">
                            No Internet Service
                        </option>

                    </select>

                </div>


                <!-- Tech Support -->

                <div class="form-group">

                    <label for="TechSupport">
                        Tech Support
                    </label>

                    <select id="TechSupport">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                        <option value="No internet service">
                            No Internet Service
                        </option>

                    </select>

                </div>


                <!-- Streaming TV -->

                <div class="form-group">

                    <label for="StreamingTV">
                        Streaming TV
                    </label>

                    <select id="StreamingTV">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                        <option value="No internet service">
                            No Internet Service
                        </option>

                    </select>

                </div>


                <!-- Streaming Movies -->

                <div class="form-group">

                    <label for="StreamingMovies">
                        Streaming Movies
                    </label>

                    <select id="StreamingMovies">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                        <option value="No internet service">
                            No Internet Service
                        </option>

                    </select>

                </div>


                <!-- Contract -->

                <div class="form-group">

                    <label for="Contract">
                        Contract
                    </label>

                    <select id="Contract">

                        <option value="Month-to-month">
                            Month-to-Month
                        </option>

                        <option value="One year">
                            One Year
                        </option>

                        <option value="Two year">
                            Two Year
                        </option>

                    </select>

                </div>


                <!-- Paperless Billing -->

                <div class="form-group">

                    <label for="PaperlessBilling">
                        Paperless Billing
                    </label>

                    <select id="PaperlessBilling">

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- Payment Method -->

                <div class="form-group">

                    <label for="PaymentMethod">
                        Payment Method
                    </label>

                    <select id="PaymentMethod">

                        <option value="Electronic check">
                            Electronic Check
                        </option>

                        <option value="Mailed check">
                            Mailed Check
                        </option>

                        <option value="Bank transfer (automatic)">
                            Bank Transfer
                        </option>

                        <option value="Credit card (automatic)">
                            Credit Card
                        </option>

                    </select>

                </div>


                <!-- Monthly Charges -->

                <div class="form-group">

                    <label for="MonthlyCharges">
                        Monthly Charges
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        id="MonthlyCharges"
                        placeholder="Example: 79.50"
                        required
                    >

                </div>


                <!-- Total Charges -->

                <div class="form-group">

                    <label for="TotalCharges">
                        Total Charges
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        min="0"
                        id="TotalCharges"
                        placeholder="Example: 1450.75"
                        required
                    >

                </div>

            </div>


            <div class="button-container">

                <button
                    type="submit"
                    id="predictButton"
                >
                    Predict Customer Churn
                </button>

            </div>

        </form>


        <div id="result"></div>

    </div>


    <div class="footer">
        Machine Learning Customer Churn Prediction System
    </div>

</div>


<script>

    document
        .getElementById("predictionForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const button =
                    document.getElementById(
                        "predictButton"
                    );


                const resultBox =
                    document.getElementById(
                        "result"
                    );


                const data = {

                    gender:
                        document
                            .getElementById("gender")
                            .value,

                    SeniorCitizen:
                        document
                            .getElementById("SeniorCitizen")
                            .value,

                    Partner:
                        document
                            .getElementById("Partner")
                            .value,

                    Dependents:
                        document
                            .getElementById("Dependents")
                            .value,

                    tenure:
                        parseInt(
                            document
                                .getElementById("tenure")
                                .value
                        ),

                    PhoneService:
                        document
                            .getElementById("PhoneService")
                            .value,

                    MultipleLines:
                        document
                            .getElementById("MultipleLines")
                            .value,

                    InternetService:
                        document
                            .getElementById("InternetService")
                            .value,

                    OnlineSecurity:
                        document
                            .getElementById("OnlineSecurity")
                            .value,

                    OnlineBackup:
                        document
                            .getElementById("OnlineBackup")
                            .value,

                    DeviceProtection:
                        document
                            .getElementById("DeviceProtection")
                            .value,

                    TechSupport:
                        document
                            .getElementById("TechSupport")
                            .value,

                    StreamingTV:
                        document
                            .getElementById("StreamingTV")
                            .value,

                    StreamingMovies:
                        document
                            .getElementById("StreamingMovies")
                            .value,

                    Contract:
                        document
                            .getElementById("Contract")
                            .value,

                    PaperlessBilling:
                        document
                            .getElementById("PaperlessBilling")
                            .value,

                    PaymentMethod:
                        document
                            .getElementById("PaymentMethod")
                            .value,

                    MonthlyCharges:
                        parseFloat(
                            document
                                .getElementById("MonthlyCharges")
                                .value
                        ),

                    TotalCharges:
                        parseFloat(
                            document
                                .getElementById("TotalCharges")
                                .value
                        )
                };


                try {

                    button.disabled = true;

                    button.innerText =
                        "Predicting...";


                    resultBox.style.display =
                        "none";

                    resultBox.classList.remove(
                        "error"
                    );


                    const response =
                        await fetch(
                            "/predict",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(data)

                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Prediction request failed"
                        );

                    }


                    const result =
                        await response.json();


                    resultBox.innerText =
                        "Prediction: " +
                        result.prediction;


                    resultBox.style.display =
                        "block";

                }

                catch (error) {

                    resultBox.innerText =
                        "Error: Could not get prediction.";


                    resultBox.classList.add(
                        "error"
                    );


                    resultBox.style.display =
                        "block";


                    console.error(error);

                }

                finally {

                    button.disabled = false;

                    button.innerText =
                        "Predict Customer Churn";

                }

            }
        );

</script>


</body>
</html>
